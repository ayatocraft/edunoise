<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Classroom Focus App</title>
  <style>
    :root {
      --bg-color: #000000;
      --card-bg: #1c1c1e;
      --accent-color: #fa114f;
      --accent-secondary: #00f5d4;
      --text-main: #ffffff;
      --text-sub: #8e8e93;
      --bronze: #cd7f32;
      --silver: #c0c0c0;
      --gold: #ffd700;
      --diamond: #b9f2ff;
      --platinum: #e5e4e2;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
      user-select: none;
    }

    body {
      background-color: var(--bg-color);
      color: var(--text-main);
      min-height: 100vh;
      display: flex;
      justify-content: center;
      align-items: center;
      overflow-x: hidden;
    }

    .container {
      width: 100%;
      max-width: 480px;
      height: 100vh;
      max-height: 850px;
      padding: 24px;
      display: flex;
      flex-direction: column;
      justify-content: space-between;
      position: relative;
      background: #000;
      border-radius: 30px;
      box-shadow: 0 20px 40px rgba(0,0,0,0.8);
      overflow: hidden;
      transition: background-color 0.3s ease;
    }

    .container.flash-warning {
      animation: warningFlash 0.4s ease-out;
    }
    @keyframes warningFlash {
      0% { background-color: rgba(255, 59, 48, 0.4); }
      100% { background-color: #000; }
    }

    .screen {
      display: none;
      flex-direction: column;
      height: 100%;
      width: 100%;
      animation: fadeIn 0.3s ease-in-out;
    }
    .screen.active {
      display: flex;
    }

    @keyframes fadeIn {
      from { opacity: 0; transform: scale(0.98); }
      to { opacity: 1; transform: scale(1); }
    }

    h1 {
      font-size: 28px;
      font-weight: 700;
      letter-spacing: -0.5px;
      margin-bottom: 8px;
    }
    p.subtitle {
      color: var(--text-sub);
      font-size: 14px;
      margin-bottom: 16px;
    }

    .btn {
      background-color: var(--card-bg);
      color: var(--text-main);
      border: none;
      padding: 16px;
      border-radius: 16px;
      font-size: 16px;
      font-weight: 600;
      cursor: pointer;
      transition: all 0.2s ease;
      display: flex;
      justify-content: center;
      align-items: center;
      gap: 8px;
    }
    .btn:active {
      transform: scale(0.96);
      opacity: 0.8;
    }
    .btn-primary {
      background: linear-gradient(135deg, #fa114f, #ff5e62);
      color: #fff;
      font-size: 20px;
      padding: 20px;
      box-shadow: 0 8px 25px rgba(250, 17, 79, 0.4);
    }
    .btn-danger {
      background-color: rgba(255, 59, 48, 0.2);
      color: #ff3b30;
    }
    .btn-secondary {
      background-color: #2c2c2e;
      color: var(--text-main);
    }
    .btn-warning {
      background-color: rgba(255, 159, 10, 0.2);
      color: #ff9f0a;
    }

    .mode-selector {
      display: flex;
      gap: 6px;
      margin-bottom: 16px;
      background: var(--card-bg);
      padding: 4px;
      border-radius: 14px;
      width: 100%;
    }
    .mode-btn {
      flex: 1;
      padding: 10px 4px;
      border-radius: 10px;
      border: none;
      background: transparent;
      color: var(--text-sub);
      font-weight: 600;
      font-size: 12px;
      cursor: pointer;
      transition: all 0.2s ease;
      text-align: center;
    }
    .mode-btn.active {
      background: var(--accent-color);
      color: #fff;
      box-shadow: 0 2px 10px rgba(250, 17, 79, 0.4);
    }

    .select-input {
      width: 100%;
      background: #2c2c2e;
      border: none;
      color: #fff;
      padding: 12px;
      border-radius: 12px;
      font-size: 14px;
      color-scheme: dark;
      outline: none;
    }

    .top-content {
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      flex-grow: 1;
    }

    .ring-container {
      position: relative;
      width: 240px;
      height: 240px;
      margin: 0 auto;
      display: flex;
      justify-content: center;
      align-items: center;
    }
    .ring-svg {
      transform: rotate(-90deg);
      width: 100%;
      height: 100%;
      filter: drop-shadow(0 0 8px rgba(250, 17, 79, 0.3));
    }
    .ring-bg {
      fill: none;
      stroke: #2c2c2e;
      stroke-width: 16;
    }
    .ring-progress {
      fill: none;
      stroke: var(--accent-color);
      stroke-width: 16;
      stroke-linecap: round;
      stroke-dasharray: 565.48;
      stroke-dashoffset: 565.48;
      transition: stroke-dashoffset 0.3s ease-out, stroke 0.5s ease;
    }

    .epic-glow {
      animation: pulseGlow 1.5s infinite alternate ease-in-out;
    }
    @keyframes pulseGlow {
      0% {
        filter: drop-shadow(0 0 10px rgba(250, 17, 79, 0.6)) drop-shadow(0 0 20px rgba(250, 17, 79, 0.4));
      }
      100% {
        filter: drop-shadow(0 0 25px rgba(0, 245, 212, 0.9)) drop-shadow(0 0 40px rgba(250, 17, 79, 0.7));
      }
    }

    .ring-text {
      position: absolute;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      text-align: center;
    }
    .ring-text .level-val {
      font-size: 38px;
      font-weight: 800;
      line-height: 1.1;
    }
    .ring-text .pts-val {
      font-size: 15px;
      font-weight: 700;
      color: var(--accent-secondary);
      margin-top: 4px;
    }
    .ring-text .sub-val {
      font-size: 13px;
      color: var(--text-sub);
      margin-top: 2px;
    }

    .stats-grid {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 12px;
      margin-top: 15px;
    }
    .stat-card {
      background-color: var(--card-bg);
      border-radius: 16px;
      padding: 12px 14px;
      display: flex;
      flex-direction: column;
    }
    .stat-label {
      font-size: 11px;
      color: var(--text-sub);
      margin-bottom: 4px;
      text-transform: uppercase;
    }
    .stat-value {
      font-size: 18px;
      font-weight: 700;
    }

    .stage-badge {
      padding: 4px 12px;
      border-radius: 20px;
      font-size: 12px;
      font-weight: 700;
      text-transform: uppercase;
      display: inline-block;
      margin-top: 6px;
    }
    .stage-Bronze { background: var(--bronze); color: #fff; }
    .stage-Silver { background: var(--silver); color: #000; }
    .stage-Gold { background: var(--gold); color: #000; }
    .stage-Diamond { background: var(--diamond); color: #000; }
    .stage-Platinum { background: var(--platinum); color: #000; }

    .meter-container {
      width: 100%;
      height: 8px;
      background-color: #2c2c2e;
      border-radius: 4px;
      overflow: hidden;
      margin-top: 8px;
    }
    .meter-bar {
      height: 100%;
      width: 0%;
      background-color: #30d158;
      transition: width 0.1s ease, background-color 0.2s;
    }

    .setting-section {
      background-color: var(--card-bg);
      border-radius: 16px;
      padding: 16px;
      margin-bottom: 12px;
    }
    .setting-title {
      font-size: 14px;
      font-weight: 700;
      color: var(--text-sub);
      margin-bottom: 10px;
    }
    .pause-list {
      max-height: 110px;
      overflow-y: auto;
      display: flex;
      flex-direction: column;
      gap: 8px;
      margin-top: 10px;
    }
    .pause-item {
      background-color: #2c2c2e;
      border-radius: 10px;
      padding: 8px 12px;
      display: flex;
      justify-content: space-between;
      align-items: center;
      font-size: 14px;
    }
    .time-inputs {
      display: flex;
      gap: 8px;
      align-items: center;
    }
    .time-inputs input {
      background: #2c2c2e;
      border: none;
      color: #fff;
      padding: 8px;
      border-radius: 8px;
      font-size: 15px;
      color-scheme: dark;
    }

    .status-indicator {
      display: flex;
      align-items: center;
      gap: 6px;
      font-size: 14px;
      font-weight: 600;
    }
    .dot {
      width: 10px;
      height: 10px;
      border-radius: 50%;
      background-color: #8e8e93;
    }
    .dot.active { background-color: #30d158; box-shadow: 0 0 10px #30d158; }
    .dot.paused { background-color: #ff9f0a; }

    #test-modal {
      display: none;
      position: absolute;
      top: 0; left: 0; width: 100%; height: 100%;
      background: rgba(0,0,0,0.85);
      z-index: 999;
      padding: 24px;
      flex-direction: column;
      justify-content: center;
      gap: 12px;
    }
    #test-modal.active {
      display: flex;
    }
  </style>
</head>
<body>

<div class="container">

  <!-- TEST MODE MODAL (Alt + T) -->
  <div id="test-modal">
    <h2 style="color: var(--accent-secondary);">🛠 テストモード</h2>
	<button class="btn btn-secondary" onclick="addTestPts(1000000)">+1000000 PT 追加</button>
	<button class="btn btn-secondary" onclick="addTestPts(100000)">+100000 PT 追加</button>
    <button class="btn btn-secondary" onclick="addTestPts(10000)">+10000 PT 追加</button>
    <button class="btn btn-secondary" onclick="addTestPts(1000)">+1000 PT 追加</button>
	<button class="btn btn-secondary" onclick="addTestPts(100)">+100 PT 追加</button>
    <button class="btn btn-secondary" id="speed-btn" onclick="toggleSpeed()">時間10倍速: OFF</button>
    <button class="btn btn-warning" id="undo-btn" onclick="undoLastRecord()" style="display: none;">↩ 記録を1つ前に戻す</button>
    <button class="btn btn-primary" onclick="toggleTestModal()">閉じる (Alt+T)</button>
  </div>

  <!-- 1. TOP SCREEN -->
  <div id="screen-top" class="screen active">
    <div>
      <h1>Classroom Focus</h1>
      <p class="subtitle">静かで快適な授業環境をつくろう</p>
    </div>

    <!-- モード切り替えバー -->
    <div class="mode-selector">
      <button class="mode-btn active" id="btn-mode-normal" onclick="selectMode('normal')">通常 (40dB)</button>
      <button class="mode-btn" id="btn-mode-study" onclick="selectMode('study')">自習 (30dB/1.5倍)</button>
      <button class="mode-btn" id="btn-mode-group" onclick="selectMode('group')">グループ (50dB)</button>
    </div>

    <div class="top-content">
      <div class="ring-container">
        <svg class="ring-svg" viewBox="0 0 220 220">
          <circle class="ring-bg" cx="110" cy="110" r="90" />
          <circle class="ring-progress" id="top-ring" cx="110" cy="110" r="90" />
        </svg>
        <div class="ring-text">
          <span class="stat-label">CURRENT</span>
          <span class="level-val" id="top-level">Lv.1</span>
          <span class="pts-val" id="top-pts">0 PT</span>
          <span class="stage-badge stage-Bronze" id="top-stage">Bronze</span>
        </div>
      </div>
    </div>

    <div>
      <div style="margin-bottom: 12px;">
        <button class="btn btn-primary" style="width: 100%;" onclick="startMeasurement()">
          計測を開始
        </button>
      </div>
      <div style="display: flex; gap: 10px;">
        <button class="btn btn-secondary" style="flex: 1;" onclick="showScreen('screen-settings')">設定</button>
        <button class="btn btn-danger" style="width: 60px;" onclick="resetData()">↺</button>
      </div>
    </div>
  </div>

  <!-- 2. MEASURING SCREEN -->
  <div id="screen-measure" class="screen">
    <div style="display: flex; justify-content: space-between; align-items: center;">
      <div>
        <span id="current-time" style="font-size: 20px; font-weight: 700;">12:00</span>
        <div class="status-indicator">
          <div class="dot" id="status-dot"></div>
          <span id="status-text">計測中</span>
        </div>
      </div>
      <div style="text-align: right;">
        <span class="stat-label" id="timer-info-label">NEXT PAUSE</span>
        <div id="next-pause-text" style="font-size: 14px; font-weight: 600;">なし</div>
      </div>
    </div>

    <div class="ring-container" style="margin-top: 10px;">
      <svg class="ring-svg" viewBox="0 0 220 220">
        <circle class="ring-bg" cx="110" cy="110" r="90" />
        <circle class="ring-progress" id="measure-ring" cx="110" cy="110" r="90" />
      </svg>
      <div class="ring-text">
        <span class="level-val" id="measure-level">Lv.1</span>
        <span class="sub-val" id="measure-pts">0 PT</span>
        <span class="sub-val" id="measure-next-pts" style="color:#555;">Next: 400pt</span>
      </div>
    </div>

    <div>
      <div style="display: flex; justify-content: space-between; font-size: 12px; color: var(--text-sub);">
        <span id="noise-status-text">判定: 静か</span>
        <span id="db-display">0 dB</span>
      </div>
      <div class="meter-container">
        <div class="meter-bar" id="meter-bar"></div>
      </div>
    </div>

    <div class="stats-grid">
      <div class="stat-card">
        <span class="stat-label">獲得ポイント</span>
        <span class="stat-value" id="session-pts" style="color: var(--accent-secondary);">0</span>
      </div>
      <div class="stat-card">
        <span class="stat-label">カウント / 騒音タイマー</span>
        <span class="stat-value" id="quiet-timer">0.0s</span>
      </div>
    </div>

    <div style="display: flex; gap: 10px; margin-top: 10px;">
      <button class="btn btn-secondary" style="flex: 1;" id="pause-btn" onclick="togglePause()">一時停止</button>
      <button class="btn btn-primary" style="flex: 1;" onclick="stopMeasurement()">終了</button>
    </div>
  </div>

  <!-- 3. SETTINGS SCREEN -->
  <div id="screen-settings" class="screen">
    <div>
      <h1>設定</h1>
      <p class="subtitle">マイクとスケジュールの設定</p>
    </div>

    <div class="setting-section">
      <div class="setting-title">使用マイク（音声入力）</div>
      <select id="mic-select" class="select-input" onchange="changeMic()">
        <option value="">マイクを読み込んでいます...</option>
      </select>
    </div>

    <div class="setting-section">
      <div class="setting-title">一括自動終了時刻</div>
      <div class="time-inputs">
        <input type="time" id="auto-end-time">
        <button class="btn btn-secondary" style="padding: 8px 16px;" onclick="saveAutoEndTime()">保存</button>
        <button class="btn btn-secondary" style="padding: 8px 16px;" onclick="clearAutoEndTime()">解除</button>
      </div>
    </div>

    <div class="setting-section" style="flex-grow: 1; display: flex; flex-direction: column;">
      <div class="setting-title">一時停止（休憩）スケジュール</div>
      <div class="time-inputs">
        <input type="time" id="pause-start" value="13:00">
        <span>〜</span>
        <input type="time" id="pause-end" value="13:30">
        <button class="btn btn-secondary" style="padding: 8px 16px;" onclick="addPauseSchedule()">追加</button>
      </div>
      <div class="pause-list" id="pause-list"></div>
    </div>
    <div class="setting-section">
  <div class="setting-title">ポイント表示</div>

  <select id="point-display-mode" class="select-input" onchange="changePointDisplayMode()">
    <option value="normal">通常表示（12,749,000,005 PT）</option>
    <option value="compact">短縮表示（12.75B PT）</option>
  </select>
</div>
    <button class="btn btn-primary" onclick="showScreen('screen-top')">完了</button>
  </div>

  <!-- 4. RESULT SCREEN -->
  <div id="screen-result" class="screen">
    <div>
      <h1>本日の成果</h1>
      <p class="subtitle">お疲れ様でした！</p>
    </div>

    <div class="top-content">
      <div class="ring-container">
        <svg class="ring-svg epic-glow" id="result-svg-element" viewBox="0 0 220 220">
          <circle class="ring-bg" cx="110" cy="110" r="90" />
          <circle class="ring-progress" id="result-ring" cx="110" cy="110" r="90" />
        </svg>
        <div class="ring-text">
          <span class="stat-label">STAGE</span>
          <span class="stage-badge stage-Bronze" id="res-stage-badge" style="font-size: 16px; padding: 6px 16px; margin-bottom: 6px;">Bronze</span>
          <span id="result-level-text" style="font-size: 22px; font-weight: 800;">Lv.1</span>
        </div>
      </div>
    </div>

    <div class="stats-grid" style="margin-bottom: 20px;">
      <div class="stat-card">
        <span class="stat-label">今回獲得ポイント</span>
        <span class="stat-value" id="res-today-pts" style="color: var(--accent-color);">+0</span>
      </div>
      <div class="stat-card">
        <span class="stat-label">累計ポイント</span>
        <span class="stat-value" id="res-total-pts">0</span>
      </div>
    </div>

    <button class="btn btn-primary" onclick="showScreen('screen-top')">トップへ戻る</button>
  </div>

</div>

<script src="https://cdn.jsdelivr.net/npm/canvas-confetti@1.9.2/dist/confetti.browser.min.js"></script>

<script>
  // --- SOUND SYNTHESIS ---
  let audioCtx = null;
  
  function initAudioContext() {
    if (!audioCtx) {
      audioCtx = new (window.AudioContext || window.webkitAudioContext)();
    }
    if (audioCtx.state === 'suspended') {
      audioCtx.resume();
    }
  }

  function playSound(type) {
    initAudioContext();
    const now = audioCtx.currentTime;

    if (type === 'point') {
      const osc = audioCtx.createOscillator();
      const gain = audioCtx.createGain();
      osc.connect(gain);
      gain.connect(audioCtx.destination);
      osc.type = 'sine';
      osc.frequency.setValueAtTime(880, now);
      gain.gain.setValueAtTime(0.08, now);
      gain.gain.exponentialRampToValueAtTime(0.001, now + 0.08);
      osc.start(now);
      osc.stop(now + 0.08);

    } else if (type === 'penalty') {
      const osc = audioCtx.createOscillator();
      const gain = audioCtx.createGain();
      osc.connect(gain);
      gain.connect(audioCtx.destination);
      osc.type = 'sawtooth';
      osc.frequency.setValueAtTime(150, now);
      osc.frequency.exponentialRampToValueAtTime(100, now + 0.2);
      gain.gain.setValueAtTime(0.12, now);
      gain.gain.exponentialRampToValueAtTime(0.001, now + 0.2);
      osc.start(now);
      osc.stop(now + 0.2);

    } else if (type === 'finish_normal') {
      [523.25, 659.25, 783.99].forEach((freq, index) => {
        const osc = audioCtx.createOscillator();
        const gain = audioCtx.createGain();
        osc.connect(gain);
        gain.connect(audioCtx.destination);
        osc.frequency.setValueAtTime(freq, now + index * 0.1);
        gain.gain.setValueAtTime(0.1, now + index * 0.1);
        gain.gain.exponentialRampToValueAtTime(0.001, now + index * 0.1 + 0.3);
        osc.start(now + index * 0.1);
        osc.stop(now + index * 0.1 + 0.3);
      });

    } else if (type === 'finish_levelup') {
      const freqs = [523.25, 659.25, 783.99, 1046.50, 1318.51];
      freqs.forEach((freq, index) => {
        const osc = audioCtx.createOscillator();
        const gain = audioCtx.createGain();
        osc.connect(gain);
        gain.connect(audioCtx.destination);
        osc.type = 'triangle';
        osc.frequency.setValueAtTime(freq, now + index * 0.08);
        gain.gain.setValueAtTime(0.15, now + index * 0.08);
        gain.gain.exponentialRampToValueAtTime(0.001, now + index * 0.08 + 0.4);
        osc.start(now + index * 0.08);
        osc.stop(now + index * 0.08 + 0.4);
      });

    } else if (type === 'finish_stageup') {
      const chord1 = [523.25, 659.25, 783.99];
      const chord2 = [587.33, 698.46, 880.00];
      const grand  = [1046.50, 1318.51, 1567.98, 2093.00];

      const playChord = (chord, time, duration) => {
        chord.forEach(f => {
          const osc = audioCtx.createOscillator();
          const gain = audioCtx.createGain();
          osc.connect(gain);
          gain.connect(audioCtx.destination);
          osc.type = 'sawtooth';
          osc.frequency.setValueAtTime(f, time);
          gain.gain.setValueAtTime(0.08, time);
          gain.gain.exponentialRampToValueAtTime(0.001, time + duration);
          osc.start(time);
          osc.stop(time + duration);
        });
      };

      playChord(chord1, now, 0.2);
      playChord(chord2, now + 0.25, 0.2);
      playChord(grand, now + 0.5, 0.8);
    }
  }

  // --- APP CONFIG & STATE ---
  // しきい値を指定通り変更: 通常40dB, 自習30dB, グループ50dB
  const MODE_CONFIG = {
    normal: { name: '通常', threshold: 40, ptTime: 3.0, multiplier: 1.0 },
    study:  { name: '自習', threshold: 30, ptTime: 2.0, multiplier: 1.5 },
    group:  { name: 'グループ', threshold: 50, ptTime: 4.0, multiplier: 0.8 }
  };

  let state = {
    totalPoints: 0,
    pauseSchedules: [],
    autoEndTime: "",
    selectedMicId: "",
    currentMode: "normal",
	pointDisplayMode: "normal"
  };

  let previousTotalPoints = null;

  let sessionPoints = 0;
  let quietAccumulator = 0;         // 静か用アキュムレータ（維持可能に改修）
  let slightlyNoisyAccumulator = 0; // 少し騒がしい用アキュムレータ（維持可能に改修）
  let noisyAccumulator = 0;         // 連続騒音タイマー (秒)
  let penaltyTimer = 0;             // ペナルティ間隔タイマー
  let isMeasuring = false;
  let isPausedState = false;
  let timeMultiplier = 1;

  let audioStream = null;
  let analyser = null;
  let microphone = null;
  let micAudioCtx = null;
  let loopInterval = null;
  let currentScreenId = 'screen-top';

  const RING_CIRCUMFERENCE = 2 * Math.PI * 90;

  // --- LOCAL STORAGE ---
  function loadState() {
  try {
    const saved = localStorage.getItem('class_focus_data_v5');

    if (saved) {
      state = { ...state, ...JSON.parse(saved) };
    }
  } catch (e) {
    console.error("Failed to load storage", e);
  }

  // デフォルト値を確実に設定
  if (!Array.isArray(state.pauseSchedules)) {
    state.pauseSchedules = [];
  }

  if (typeof state.totalPoints !== 'number') {
    state.totalPoints = 0;
  }

  if (!state.pointDisplayMode) {
    state.pointDisplayMode = 'normal';
  }

  if (!state.currentMode || !MODE_CONFIG[state.currentMode]) {
    state.currentMode = 'normal';
  }

  // 設定画面のUIへ保存値を反映
  const pointDisplaySelect = document.getElementById('point-display-mode');

  if (pointDisplaySelect) {
    pointDisplaySelect.value = state.pointDisplayMode;
  }

  if (state.autoEndTime) {
    document.getElementById('auto-end-time').value = state.autoEndTime;
  }

  // モードを反映
  selectMode(state.currentMode);

  // ★保存されている表示形式を使って最初からUIを描画
  updateTopUI();

  renderPauseList();
  initMicDevices();

  // ★初期化後にももう一度確実に反映
  if (pointDisplaySelect) {
    pointDisplaySelect.value = state.pointDisplayMode;
  }
}

  function saveState() {
    try {
      localStorage.setItem('class_focus_data_v5', JSON.stringify(state));
    } catch(e) {
      console.error("Failed to save storage", e);
    }
  }

  // --- MODE SELECTION ---
  function selectMode(modeKey) {
    if (!MODE_CONFIG[modeKey]) return;
    state.currentMode = modeKey;
    saveState();

    document.querySelectorAll('.mode-btn').forEach(btn => btn.classList.remove('active'));
    const btn = document.getElementById(`btn-mode-${modeKey}`);
    if (btn) btn.classList.add('active');
  }

  // --- MIC DEVICE MANAGEMENT ---
  async function initMicDevices() {
    try {
      await navigator.mediaDevices.getUserMedia({ audio: true });
      const devices = await navigator.mediaDevices.enumerateDevices();
      const audioDevices = devices.filter(device => device.kind === 'audioinput');
      
      const select = document.getElementById('mic-select');
      select.innerHTML = '';

      audioDevices.forEach((device, index) => {
        const option = document.createElement('option');
        option.value = device.deviceId;
        option.text = device.label || `マイク ${index + 1}`;
        select.appendChild(option);
      });

      if (state.selectedMicId && audioDevices.some(d => d.deviceId === state.selectedMicId)) {
        select.value = state.selectedMicId;
      } else if (audioDevices.length > 0) {
        state.selectedMicId = audioDevices[0].deviceId;
        saveState();
      }
    } catch (err) {
      console.error("マイクデバイスの取得に失敗:", err);
    }
  }

  async function changeMic() {
    const select = document.getElementById('mic-select');
    state.selectedMicId = select.value;
    saveState();

    if (isMeasuring) {
      await setupAudioStream();
    }
  }

  async function setupAudioStream() {
    if (audioStream) {
      audioStream.getTracks().forEach(track => track.stop());
    }

    const constraints = {
      audio: state.selectedMicId ? { deviceId: { exact: state.selectedMicId } } : true
    };

    audioStream = await navigator.mediaDevices.getUserMedia(constraints);
    micAudioCtx = new (window.AudioContext || window.webkitAudioContext)();
    
    if (micAudioCtx.state === 'suspended') {
      await micAudioCtx.resume();
    }

    analyser = micAudioCtx.createAnalyser();
    microphone = micAudioCtx.createMediaStreamSource(audioStream);
    microphone.connect(analyser);
    analyser.fftSize = 256;
  }

  // --- LEVEL & STAGE CALCULATIONS ---
  function getRequiredPtsForLevel(lvl) {
  if (lvl <= 10) return 400;

  // Lv.11以降は徐々に必要ポイントを増加
  return Math.floor(400 * Math.pow(1.055, lvl - 10));
}

  function calculateLevelInfo(pts) {
    let currentLvl = 1;
    let ptsRemaining = Math.max(0, pts);

    while (true) {
      let req = getRequiredPtsForLevel(currentLvl);
      if (ptsRemaining >= req) {
        ptsRemaining -= req;
        currentLvl++;
      } else {
        break;
      }
    }

    let stage = "Bronze";
    if (currentLvl >= 141) stage = "Platinum";
    else if (currentLvl >= 101) stage = "Diamond";
    else if (currentLvl >= 61) stage = "Gold";
    else if (currentLvl >= 31) stage = "Silver";

    return {
      level: currentLvl,
      currentLevelPts: ptsRemaining,
      nextLevelReq: getRequiredPtsForLevel(currentLvl),
      stage: stage
    };
  }
function formatPoints(pts) {
  if (state.pointDisplayMode !== "compact") {
    return Math.floor(pts).toLocaleString();
  }

  const abs = Math.abs(pts);
  const sign = pts < 0 ? "-" : "";

  if (abs >= 1_000_000_000) {
    return `${sign}${(abs / 1_000_000_000).toFixed(2)}B`;
  }

  if (abs >= 1_000_000) {
    return `${sign}${(abs / 1_000_000).toFixed(2)}M`;
  }

  if (abs >= 1_000) {
    return `${sign}${(abs / 1_000).toFixed(2)}K`;
  }

  return `${Math.floor(pts)}`;
}
function changePointDisplayMode() {
  const select = document.getElementById('point-display-mode');

  if (!select) return;

  state.pointDisplayMode = select.value;

  saveState();

  // 即座に画面へ反映
  updateTopUI();
  updateMeasureUI();

  if (currentScreenId === 'screen-result') {
    document.getElementById('res-total-pts').innerText =
      formatPoints(state.totalPoints);
  }
}
  // --- UI & RINGS ---
  function setRingProgress(ringId, currentPts, maxPts) {
    const ring = document.getElementById(ringId);
    if (!ring) return;
    const ratio = Math.min(1, Math.max(0, currentPts / maxPts));
    const offset = RING_CIRCUMFERENCE * (1 - ratio);
    
    ring.style.strokeDasharray = RING_CIRCUMFERENCE;
    requestAnimationFrame(() => {
      ring.style.strokeDashoffset = offset;
    });
  }

  function showScreen(screenId) {
    currentScreenId = screenId;
    document.querySelectorAll('.screen').forEach(s => s.classList.remove('active'));
    document.getElementById(screenId).classList.add('active');
    if (screenId === 'screen-top') {
      updateTopUI();
    }
  }

  function updateTopUI() {
    const info = calculateLevelInfo(state.totalPoints);
    document.getElementById('top-level').innerText = `Lv.${info.level}`;
    document.getElementById('top-pts').innerText =
  `${formatPoints(state.totalPoints)} PT`;
    
    const badge = document.getElementById('top-stage');
    badge.innerText = info.stage;
    badge.className = `stage-badge stage-${info.stage}`;

    setTimeout(() => {
      setRingProgress('top-ring', info.currentLevelPts, info.nextLevelReq);
    }, 50);
  }

  // --- SETTINGS MANAGEMENT ---
  function saveAutoEndTime() {
    state.autoEndTime = document.getElementById('auto-end-time').value;
    saveState();
    alert('自動終了時刻を保存しました');
  }

  function clearAutoEndTime() {
    state.autoEndTime = "";
    document.getElementById('auto-end-time').value = "";
    saveState();
    alert('自動終了時刻を解除しました');
  }

  function addPauseSchedule() {
    const start = document.getElementById('pause-start').value;
    const end = document.getElementById('pause-end').value;
    if (start && end) {
      state.pauseSchedules.push({ start, end, id: Date.now() });
      saveState();
      renderPauseList();
    }
  }

  function deletePauseSchedule(id) {
    state.pauseSchedules = state.pauseSchedules.filter(item => item.id !== id);
    saveState();
    renderPauseList();
  }

  function renderPauseList() {
    const list = document.getElementById('pause-list');
    list.innerHTML = '';
    state.pauseSchedules.forEach(item => {
      const div = document.createElement('div');
      div.className = 'pause-item';
      div.innerHTML = `
        <span>${item.start} 〜 ${item.end}</span>
        <button class="btn btn-danger" style="padding: 4px 8px; font-size: 12px;" onclick="deletePauseSchedule(${item.id})">削除</button>
      `;
      list.appendChild(div);
    });
  }

  function isAutoPausedNow() {
    const now = new Date();
    const currentMins = now.getHours() * 60 + now.getMinutes();

    return state.pauseSchedules.some(sched => {
      const [sH, sM] = sched.start.split(':').map(Number);
      const [eH, eM] = sched.end.split(':').map(Number);
      return currentMins >= (sH * 60 + sM) && currentMins < (eH * 60 + eM);
    });
  }

  function checkAutoEnd() {
    if (!state.autoEndTime) return false;
    const now = new Date();
    const currentMins = now.getHours() * 60 + now.getMinutes();
    const [eH, eM] = state.autoEndTime.split(':').map(Number);
    return currentMins === (eH * 60 + eM);
  }

  // --- MEASUREMENT LOGIC ---
  async function startMeasurement() {
    try {
      initAudioContext();
      await setupAudioStream();

      sessionPoints = 0;
      quietAccumulator = 0;
      slightlyNoisyAccumulator = 0;
      noisyAccumulator = 0;
      penaltyTimer = 0;
      isMeasuring = true;
      isPausedState = isAutoPausedNow();

      showScreen('screen-measure');
      updateMeasureUI();
      if (loopInterval) clearInterval(loopInterval);
      loopInterval = setInterval(measurementLoop, 100);
    } catch (err) {
      alert('マイクの使用許可またはデバイス接続を確認してください。');
    }
  }

  function togglePause() {
    isPausedState = !isPausedState;
    document.getElementById('pause-btn').innerText = isPausedState ? "再開" : "一時停止";
  }

  function measurementLoop() {
    if (!isMeasuring) return;

    if (checkAutoEnd()) {
      stopMeasurement();
      return;
    }

    const now = new Date();
    document.getElementById('current-time').innerText = now.toTimeString().substring(0, 5);

    if (isAutoPausedNow() && !isPausedState) {
      isPausedState = true;
    }

    const dot = document.getElementById('status-dot');
    const statusText = document.getElementById('status-text');
    const pauseBtn = document.getElementById('pause-btn');

    if (isPausedState) {
      dot.className = 'dot paused';
      statusText.innerText = "一時停止中";
      pauseBtn.innerText = "再開";
      document.getElementById('meter-bar').style.width = '0%';
      return;
    } else {
      dot.className = 'dot active';
      statusText.innerText = "計測中";
      pauseBtn.innerText = "一時停止";
    }

    if (state.autoEndTime) {
      document.getElementById('timer-info-label').innerText = "AUTO END";
      document.getElementById('next-pause-text').innerText = state.autoEndTime;
    } else {
      document.getElementById('timer-info-label').innerText = "NEXT PAUSE";
      const nextSched = state.pauseSchedules.find(s => {
        const [sH, sM] = s.start.split(':').map(Number);
        return (sH * 60 + sM) > (now.getHours() * 60 + now.getMinutes());
      });
      document.getElementById('next-pause-text').innerText = nextSched ? nextSched.start : "なし";
    }

    // 音量解析
    const dataArray = new Uint8Array(analyser.frequencyBinCount);
    analyser.getByteFrequencyData(dataArray);
    let sum = 0;
    for (let i = 0; i < dataArray.length; i++) sum += dataArray[i];
    let volumeDb = Math.round(sum / dataArray.length);

    document.getElementById('db-display').innerText = `${volumeDb} dB`;
    const meterBar = document.getElementById('meter-bar');
    meterBar.style.width = `${Math.min(100, (volumeDb / 80) * 100)}%`;

    const statusLabel = document.getElementById('noise-status-text');
    const timeStep = 0.1 * timeMultiplier;
    const currentConfig = MODE_CONFIG[state.currentMode];

    // 1. 静か判定 (指定しきい値以下：緑ゲージ)
    if (volumeDb <= currentConfig.threshold) {
      meterBar.style.backgroundColor = '#30d158';
      statusLabel.innerText = `判定: 静か [${currentConfig.name}]`;

      // 赤ゲージ（かなり騒がしい）タイマーのみリセット。
      // quietAccumulator はリセットせず前回の数値を引き継ぐ
      noisyAccumulator = 0;
      penaltyTimer = 0;

      quietAccumulator += timeStep;
      if (quietAccumulator >= currentConfig.ptTime) {
        const ptsGained = Math.round(1 * currentConfig.multiplier);
        sessionPoints += ptsGained;
        quietAccumulator = 0; // ポイント獲得時のみ0に戻す
        playSound('point');
      }
      document.getElementById('quiet-timer').innerText = `${quietAccumulator.toFixed(1)}s / ${currentConfig.ptTime}s`;

    } 
    // 2. 少し騒がしい判定 (しきい値超 ～ 75dB：黄ゲージ) ※カウントを引き継ぐ
    else if (volumeDb <= 75) {
      meterBar.style.backgroundColor = '#ff9f0a';
      statusLabel.innerText = `判定: 少し騒がしい`;

      // 赤ゲージ（かなり騒がしい）タイマーのみリセット。
      // quietAccumulatorはリセットせずに固定保持（次の静か状態で続きから再開可能）
      noisyAccumulator = 0;
      penaltyTimer = 0;

      slightlyNoisyAccumulator += timeStep;
      if (slightlyNoisyAccumulator >= 5.0) { // 5秒ごとに1pt獲得
        sessionPoints += 1;
        slightlyNoisyAccumulator = 0;
        playSound('point');
      }
      document.getElementById('quiet-timer').innerText = `保持: ${quietAccumulator.toFixed(1)}s (注意: ${slightlyNoisyAccumulator.toFixed(1)}s)`;

    } 
    // 3. かなり騒がしい判定 (75dB超：赤ゲージ) ※30秒連続で減点
    else {
      meterBar.style.backgroundColor = '#ff3b30';
      
      // 赤ゲージのときだけ積立カウントをリセット（ペナルティ対象のため）
      quietAccumulator = 0;
      slightlyNoisyAccumulator = 0;

      noisyAccumulator += timeStep;

      if (noisyAccumulator >= 30.0) {
        statusLabel.innerText = `⚠️ 騒音警告! (-3pt/秒 減点中)`;
        
        const container = document.querySelector('.container');
        container.classList.add('flash-warning');
        setTimeout(() => container.classList.remove('flash-warning'), 300);

        penaltyTimer += timeStep;
        if (penaltyTimer >= 1.0) {
          sessionPoints -= 3;
          penaltyTimer = 0;
          playSound('penalty');
        }
        document.getElementById('quiet-timer').innerText = `警告: ${noisyAccumulator.toFixed(1)}s`;
      } else {
        statusLabel.innerText = `判定: かなり騒がしい (30sまであと${(30.0 - noisyAccumulator).toFixed(1)}s)`;
        document.getElementById('quiet-timer').innerText = `STOP (${noisyAccumulator.toFixed(1)}s)`;
      }
    }

    updateMeasureUI();
  }

  function updateMeasureUI() {
    const totalWithSession = state.totalPoints + sessionPoints;
    const info = calculateLevelInfo(totalWithSession);

    document.getElementById('measure-level').innerText = `Lv.${info.level}`;
    document.getElementById('measure-pts').innerText =
  `${formatPoints(info.currentLevelPts)} PT`;
    document.getElementById('measure-next-pts').innerText = `Next: ${info.nextLevelReq}pt`;
    document.getElementById('session-pts').innerText =
  sessionPoints >= 0
    ? `+${formatPoints(sessionPoints)}`
    : formatPoints(sessionPoints);

    setRingProgress('measure-ring', info.currentLevelPts, info.nextLevelReq);
  }

  // --- STOP & RESULT SCREEN ---
  function stopMeasurement() {
    isMeasuring = false;
    if (loopInterval) clearInterval(loopInterval);
    if (audioStream) {
      audioStream.getTracks().forEach(track => track.stop());
    }

    turnOffSpeed();

    const startInfo = calculateLevelInfo(state.totalPoints);

    previousTotalPoints = state.totalPoints;
    state.totalPoints += sessionPoints;
    saveState();

    const endInfo = calculateLevelInfo(state.totalPoints);
    const levelsGained = endInfo.level - startInfo.level;

    if (endInfo.stage !== startInfo.stage) {
      playSound('finish_stageup');
    } else if (levelsGained > 0) {
      playSound('finish_levelup');
    } else {
      playSound('finish_normal');
    }

    document.getElementById('res-today-pts').innerText = (sessionPoints >= 0 ? `+${sessionPoints}` : `${sessionPoints}`);
    document.getElementById('res-total-pts').innerText =
  formatPoints(state.totalPoints);
    document.getElementById('result-level-text').innerText = `Level ${endInfo.level}`;

    const badge = document.getElementById('res-stage-badge');
    badge.innerText = `${endInfo.stage} STAGE`;
    badge.className = `stage-badge stage-${endInfo.stage}`;

    showScreen('screen-result');

    if (levelsGained > 0 && typeof confetti === 'function') {
      confetti({
        particleCount: 120,
        spread: 80,
        origin: { y: 0.6 }
      });
    }

    const resultSvg = document.getElementById('result-svg-element');
    resultSvg.style.transition = 'none';
    resultSvg.style.transform = 'rotate(-90deg) scale(0.8)';
    void resultSvg.offsetWidth;

    const baseRotation = 720;
    const extraRotations = levelsGained * 360;
    const totalDegree = -90 + baseRotation + extraRotations;

    resultSvg.style.transition = 'transform 2.0s cubic-bezier(0.15, 0.85, 0.35, 1.2)';
    resultSvg.style.transform = `rotate(${totalDegree}deg) scale(1.05)`;

    setTimeout(() => {
      resultSvg.style.transition = 'transform 0.5s ease-out';
      resultSvg.style.transform = `rotate(${totalDegree}deg) scale(1.0)`;
      setRingProgress('result-ring', endInfo.currentLevelPts, endInfo.nextLevelReq);
    }, 2000);
  }

  function resetData() {
    if (confirm("全てのポイントと設定をリセットしますか？")) {
      previousTotalPoints = state.totalPoints;
     state = {
  totalPoints: 0,
  pauseSchedules: [],
  autoEndTime: "",
  selectedMicId: "",
  currentMode: "normal"
};
      saveState();
      
      sessionPoints = 0;
      quietAccumulator = 0;
      slightlyNoisyAccumulator = 0;
      noisyAccumulator = 0;

      document.getElementById('auto-end-time').value = "";
      selectMode('normal');
      updateTopUI();
      renderPauseList();
    }
  }

  // --- TEST MODE (Alt + T) ---
  window.addEventListener('keydown', (e) => {
    if (e.altKey && (e.key === 't' || e.key === 'T')) {
      toggleTestModal();
    }
  });

  function toggleTestModal() {
    const modal = document.getElementById('test-modal');
    modal.classList.toggle('active');

    const undoBtn = document.getElementById('undo-btn');
    if (currentScreenId === 'screen-top' && previousTotalPoints !== null) {
      undoBtn.style.display = 'block';
    } else {
      undoBtn.style.display = 'none';
    }
  }

  function addTestPts(pts) {
    if (isMeasuring) {
      sessionPoints += pts;
      updateMeasureUI();
    } else {
      previousTotalPoints = state.totalPoints;
      state.totalPoints += pts;
      saveState();
      updateTopUI();
    }
  }

  function undoLastRecord() {
    if (currentScreenId === 'screen-top' && previousTotalPoints !== null) {
      state.totalPoints = previousTotalPoints;
      previousTotalPoints = null;
      saveState();
      updateTopUI();
      document.getElementById('undo-btn').style.display = 'none';
      alert('記録を1つ前の状態に戻しました。');
    }
  }

  function toggleSpeed() {
    timeMultiplier = timeMultiplier === 1 ? 10 : 1;
    updateSpeedBtn();
  }

  function turnOffSpeed() {
    timeMultiplier = 1;
    updateSpeedBtn();
  }

  function updateSpeedBtn() {
    document.getElementById('speed-btn').innerText = `時間10倍速: ${timeMultiplier === 10 ? 'ON' : 'OFF'}`;
  }

  // App Initialize
  loadState();
</script>
</body>
</html>
